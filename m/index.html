<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>台股投組行動版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：單欄手機 App。上方固定燈號列，下方固定五個分頁，中間是卡片清單；桌機置中 720px。 */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunken:#e4e9f1; --ink:#152033; --muted:#5a6880; --line:#d5dce8;
  --accent:#1d5fc4; --accent-ink:#ffffff;
  --up:#cf2f27; --down:#12864a;            /* 台股慣例：紅漲綠跌 */
  --lamp-red:#d63a31; --lamp-orange:#e2761b; --lamp-yellow:#c79a06; --lamp-green:#1c9a57; --lamp-ink:#ffffff;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1219; --surface:#161d28; --sunken:#1f2836; --ink:#e7ecf4; --muted:#93a1b7; --line:#2a3445;
  --accent:#74abff; --accent-ink:#0b1320; --up:#ff6f64; --down:#42d389;
  --lamp-red:#ff5d52; --lamp-orange:#ff9a3d; --lamp-yellow:#f0c53a; --lamp-green:#3fd487; --lamp-ink:#0b1320; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#161d28; --sunken:#1f2836; --ink:#e7ecf4; --muted:#93a1b7; --line:#2a3445;
  --accent:#74abff; --accent-ink:#0b1320; --up:#ff6f64; --down:#42d389;
  --lamp-red:#ff5d52; --lamp-orange:#ff9a3d; --lamp-yellow:#f0c53a; --lamp-green:#3fd487; --lamp-ink:#0b1320; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.lampdot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--muted)}
.lamp-red{background:var(--lamp-red)} .lamp-orange{background:var(--lamp-orange)} .lamp-yellow{background:var(--lamp-yellow)} .lamp-green{background:var(--lamp-green)}
.top b{font-size:16px} .top .when{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}

main{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card.flat{background:none;border:0;padding:0}
.banner{border-left:6px solid var(--muted)}
.banner.b-red{border-left-color:var(--lamp-red)} .banner.b-orange{border-left-color:var(--lamp-orange)}
.banner.b-yellow{border-left-color:var(--lamp-yellow)} .banner.b-green{border-left-color:var(--lamp-green)}
.banner .lv{font-size:20px;font-weight:700} .banner p{margin:6px 0 0}
.warn{background:var(--sunken);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kv .k{font-size:12px;color:var(--muted)} .kv .v{font-size:19px;font-weight:650;line-height:1.3}
.kv .s{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0} .row .k{color:var(--muted);flex:none} .row .v{text-align:right;min-width:0;overflow-wrap:anywhere}

.gauge{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.g .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.track{position:relative;height:12px;border-radius:6px;background:var(--sunken);margin-top:4px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.axis{position:relative;height:16px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}

.pos{padding:0;overflow:hidden}
.pos summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.pos summary::-webkit-details-marker{display:none}
.pos .nm{font-size:16px;font-weight:650;overflow-wrap:anywhere} .pos .tk{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.pos .pl{font-size:16px;font-weight:650;text-align:right}
.pos .sub{font-size:12px;color:var(--muted)} .pos .sub.r{text-align:right}
.wbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunken);margin-top:6px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent)}
.pos .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.chip{display:inline-block;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--sunken);color:var(--ink);white-space:nowrap}
.chip.c-done{background:var(--lamp-green);color:var(--lamp-ink)} .chip.c-overdue{background:var(--lamp-red);color:var(--lamp-ink)}
.chip.c-upcoming{background:var(--lamp-orange);color:var(--lamp-ink)}
.cp{padding:8px 0;border-bottom:1px solid var(--line)} .cp:last-child{border-bottom:0}
.cp .t{display:flex;gap:8px;align-items:flex-start} .cp .t span:last-child{min-width:0;overflow-wrap:anywhere}
.cp .n{font-size:12px;color:var(--muted);margin:3px 0 0}
.cp details summary{font-size:12px;color:var(--accent);cursor:pointer;margin-top:3px}
.cp details p{font-size:13px;margin:6px 0 0;color:var(--muted);overflow-wrap:anywhere}
.news a{color:var(--ink);text-decoration:none;display:block;padding:9px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.news a:last-child{border-bottom:0} .news .m{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px} th:first-child,td:first-child{text-align:left}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.note{font-size:12px;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:0}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:12px;border-top:3px solid transparent;margin-top:-1px}
.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:650}

.lock{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.lock button{padding:11px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer}
.err{color:var(--up);font-size:13px;min-height:1.4em}
.eqform{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.eqform label{flex:1 1 150px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;min-width:0}
.eqform input{flex:1;min-width:0;border:0;background:none;font-size:18px;padding:10px 0;font-family:var(--num);outline:0}
.eqform label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.btn{padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn[disabled]{opacity:.5}
.sync details summary{color:var(--accent);cursor:pointer;font-size:13px;margin-top:10px}
.sync .tok{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sync .tok input{flex:1 1 160px;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px}
</style>

<header class="top"><div class="wrap">
  <span class="lampdot" id="hd-dot"></span><b id="hd-level">台股投組</b>
  <span class="when" id="hd-when"></span>
</div></header>

<main><div class="wrap">
  <form class="lock" id="lock" hidden>
    <h1 style="font-size:20px">輸入通關密語</h1>
    <p class="muted" style="margin:0">這一頁的投組資料已加密，密語只在這支手機上用來解密，不會送出。</p>
    <input class="search" id="lock-pass" type="password" autocomplete="current-password" aria-label="通關密語">
    <button type="submit">解鎖</button>
    <div class="err" id="lock-err" role="alert"></div>
  </form>
  <div id="app" class="stack"></div>
</div></main>

<nav class="tabs" id="tabs" aria-label="分頁"><div class="wrap">
  <a href="#overview">總覽</a><a href="#holdings">持股</a><a href="#scenarios">情境</a><a href="#news">新聞</a><a href="#lookup">查詢</a>
</div></nav>

<script>
(function(){
"use strict";
var D=null, app=document.getElementById("app");
var VIEWS=["overview","holdings","scenarios","news","lookup"];

/* ---------- 小工具 ---------- */
function h(tag, attrs){
  var e=document.createElement(tag), i, c;
  if(attrs) for(var k in attrs){ if(attrs[k]==null) continue;
    if(k==="class") e.className=attrs[k]; else if(k==="text") e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); }
  for(i=2;i<arguments.length;i++){ c=arguments[i]; if(c==null||c===false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x!=null&&x!==false) e.appendChild(typeof x==="string"?document.createTextNode(x):x); });
    else e.appendChild(typeof c==="string"?document.createTextNode(c):c); }
  return e;
}
function ok(x){ return x!=null && x===x && isFinite(x); }
function n0(x){ return ok(x)? Math.round(x).toLocaleString("en-US") : "—"; }
function nd(x,d){ return ok(x)? Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}) : "—"; }
function wan(x){ return ok(x)? n0(x/1e4)+" 萬" : "—"; }
function sgn(x,d){ return ok(x)? (x>0?"+":"")+nd(x,d==null?1:d) : "—"; }
function pct(x,d){ return ok(x)? nd(x,d==null?1:d)+"%" : "—"; }
function spct(x,d){ return ok(x)? sgn(x,d)+"%" : "—"; }
function cls(x){ return !ok(x)||x===0? "" : (x>0?"up":"down"); }
function span(text,c){ return h("span",{class:c,text:text}); }
function num(text,c){ return h("span",{class:"num "+(c||""),text:text}); }
function row(k,v){ return h("div",{class:"row"},h("span",{class:"k",text:k}),h("span",{class:"v"},v)); }
function card(title){ var c=h("section",{class:"card"}); if(title) c.appendChild(h("h2",{text:title,style:"margin-bottom:8px"}));
  for(var i=1;i<arguments.length;i++) if(arguments[i]) c.appendChild(arguments[i]); return c; }
function kv(k,v,s,c){ return h("div",{class:"kv"},h("div",{class:"k",text:k}),h("div",{class:"v num "+(c||""),text:v}),s?h("div",{class:"s",text:s}):null); }
function table(heads, rows){
  var t=h("table",null,h("thead",null,h("tr",null,heads.map(function(x){return h("th",{text:x});}))));
  var tb=h("tbody"); rows.forEach(function(r){ tb.appendChild(h("tr",null,r.map(function(c){
    return (c&&c.nodeType)? h("td",null,c) : h("td",{class:"num",text:String(c)}); }))); });
  t.appendChild(tb); return h("div",{class:"scroll"},t);
}
function safeUrl(u){ return (typeof u==="string" && /^https:\/\//.test(u))? u : null; }

/* ---------- 總覽 ---------- */
function gaugeRow(label, v, pts, max){
  var w=ok(v)? Math.max(0,Math.min(100,v/max*100)) : 0;
  return h("div",{class:"g"},
    h("div",{class:"lab"},span(label), num(ok(v)? "再跌 "+nd(v,1)+"%"+(ok(pts)?"｜約 "+n0(pts)+" 點":"") : "這個條件下不會觸及")),
    h("div",{class:"track"},ok(v)? h("i",{class:"fill",style:"width:"+w+"%"}) : null,
      [10,15,25].map(function(t){return h("i",{class:"tick",style:"left:"+(t/max*100)+"%"});})));
}
function viewOverview(){
  var a=D.alert, out=[];
  if(!a){ return [card("追繳警示",h("p",{text:"還沒有警示資料。請先在電腦上跑一次每日更新。"}))]; }
  var b=a.portfolio.beta, c=a.portfolio.cons_beta;
  var ban=h("section",{class:"card banner b-"+a.level_key},
    h("div",{class:"lv",text:a.level}), h("p",{text:a.action||""}));
  var notes=[];
  if(a.price_before_equity) notes.push("價格日期早於權益數輸入日，今晚更新後才會一致。");
  if(ok(a.equity_mtm_adj) && Math.abs(a.equity_mtm_adj)>1) notes.push("權益數 "+a.equity_as_of+" 輸入 "+wan(a.equity_entered)+"，之後以收盤價估算損益 "+sgn(a.equity_mtm_adj/1e4,0)+" 萬。");
  (a.missing_price||[]).forEach(function(m){ notes.push("無價格未計入："+m.name+" "+n0(m.lots)+" 口，實際曝險更大。"); });
  if(D.meta.positions_changed) notes.push("庫存檔的部位和這份警示不一致（"+D.meta.positions_changed+"）。請在電腦上重跑追繳警示。");
  if(D.meta.alert_age_hours>36) notes.push("警示是 "+(a.generated_at||"").slice(0,16).replace("T"," ")+" 算的，已超過一天半沒更新。");
  (a.excluded||[]).forEach(function(m){ notes.push("未計入："+m.name+"（"+(m.account||"其他")+" 帳戶，名目 "+wan(m.notional)+"）。"); });
  if(D.meta.equity_stale_days>7) notes.push("權益數已 "+D.meta.equity_stale_days+" 天沒更新，追繳距離可能失真。");
  notes.forEach(function(t){ ban.appendChild(h("div",{class:"warn",text:t})); });
  if(a.phone_override){
    ban.appendChild(h("div",{class:"warn",text:"權益數是這支手機 "+OV.at+" 輸入的 "+wan(OV.equity)+"，燈號、距離、情境已在手機上重算；價格與 beta 仍是電腦上次更新的。"}));
    if(OVX&&OVX.stale) ban.appendChild(h("div",{class:"warn",style:"border:1px solid var(--lamp-red)",text:"注意：這個權益數是 "+OV.as_of+" 輸入的，之後到 "+baseDay()+" 的損益沒有算進去，燈號可能比實際樂觀。請重新輸入今天的權益數。"}));
  }
  out.push(ban);
  out.push(equityCard());

  var unreal=D.holdings.reduce(function(s,x){return s+(ok(x.unrealized)?x.unrealized:0);},0);
  out.push(h("section",{class:"grid"},
    kv("權益數", wan(a.equity), a.scope||""),
    kv("未平倉損益", sgn(unreal/1e4,0)+" 萬", "以 "+a.price_date+" 價格", cls(unreal)),
    kv("持股名目", wan(a.notional), "槓桿 "+nd(a.leverage,2)+" 倍"),
    kv("風險指標", pct(a.risk_indicator_pct,0), "低於 25% 盤中代沖銷"),
    kv("大盤跌 1%", "−"+n0(c.loss_per_1pct/1e4)+" 萬", "常態估 −"+n0(b.loss_per_1pct/1e4)+" 萬","down"),
    kv("投組 beta", nd(c.portfolio_beta,2), "常態 "+nd(b.portfolio_beta,2)+"｜保守取最大")));

  var max=40;
  out.push(card("大盤再跌多少會出事",
    h("div",{class:"gauge"},
      gaugeRow("急跌追繳（燈號用）", c.drop_to_margin_call_alert_pct, c.taiex_at_alert_call, max),
      gaugeRow("多日緩跌追繳", c.drop_to_margin_call_pct, c.taiex_at_margin_call, max),
      gaugeRow("急跌盤中代沖銷", c.drop_to_liquidation_fixed_pct, ok(c.drop_to_liquidation_fixed_pct)? a.taiex*(1-c.drop_to_liquidation_fixed_pct/100):null, max)),
    h("div",{class:"axis"},[0,10,15,25,40].map(function(t){return h("span",{style:"left:"+(t/max*100)+"%",text:t+"%"});})),
    h("p",{class:"note",style:"margin:6px 0 0",text:"刻度線是燈號門檻：10% 紅、15% 橘、25% 黃。加權指數 "+n0(a.taiex)+"（"+a.taiex_date+"）。"})));

  if((a.lines||[]).length){
    out.push(card("指數點位警戒線", table(["狀態","大盤再跌","加權指數"], a.lines.map(function(l){
      return [span(l.level), ok(l.enter_after_drop_pct)&&l.enter_after_drop_pct>0? nd(l.enter_after_drop_pct,1)+"%" : "已進入", n0(l.taiex)]; }))));
  }
  out.push(card("保證金",
    h("div",{class:"rows"},
      row("原始保證金", num(wan(a.init_margin))), row("維持保證金", num(wan(a.maint_margin))),
      row("高於維持保證金", num(wan(a.excess_over_maint))),
      row("每 100 點損失（保守）", num(wan(c.loss_per_100pts))),
      row("個股波動緩衝", num(wan(a.idio_buffer))),
      row("期交所保證金表", num(a.margin_table_date||"—")))));
  if((D.alert_log||[]).length>1){
    out.push(card("近日燈號", table(["日期","燈號","指數","急跌追繳距離","槓桿"], D.alert_log.map(function(r){
      return [r.date, span(r.level), n0(r.taiex), pct(r.drop_to_call_alert_pct,1), nd(r.leverage,2)]; }))));
  }
  out.push(h("p",{class:"note",text:"警示計算時間 "+(a.generated_at||"").slice(0,16).replace("T"," ")+"｜頁面產生時間 "+D.meta.generated_at+"。本頁整理資料與情境，不是買賣建議。"}));
  return out;
}

/* ---------- 持股 ---------- */
var CP_LABEL={done:"已達成",overdue:"逾期",upcoming:"45 天內",ongoing:"持續追蹤",pending:"未到期"};
function stars(n){ return ok(n)? "★".repeat(Math.round(n))+"☆".repeat(Math.max(0,5-Math.round(n))) : "—"; }
function posCard(x, watch){

var BASE=null, OV=null, OVX=null, TOKEN=null, KEY=null, SKEY=null, SALT=null, ITER=null, ENC=false, syncMsg="", sending=null;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* 存在手機上的東西：加密版一律用通關密語衍生的金鑰加密後才寫進 localStorage（同網域的其他頁面讀不到內容）；
   明文版（本機／私人頁面）只存權益數，不存金鑰。 */
function sPut(k,obj){
  if(obj==null) return Promise.resolve(lsSet(k,null));
  var txt=JSON.stringify(obj);
  if(!ENC) return Promise.resolve(lsSet(k,"p:"+txt));
  if(!SKEY) return Promise.resolve(false);
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},SKEY,new TextEncoder().encode(txt)).then(
    function(ct){ return lsSet(k,"e:"+b64e(iv)+":"+b64e(ct)); }, function(){ return false; });
}
function sGet(k){
  var v=lsGet(k); if(!v) return Promise.resolve(null);
  if(v.slice(0,2)==="p:" && !ENC){ try{ return Promise.resolve(JSON.parse(v.slice(2))); }catch(e){ return Promise.resolve(null); } }
  if(v.slice(0,2)==="e:" && ENC && SKEY){ var p=v.split(":");
    return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(p[1])},SKEY,b64(p[2])).then(
      function(buf){ return JSON.parse(new TextDecoder().decode(buf)); }, function(){ return null; }); }
  if(v.slice(0,2)!=="e:" || !ENC) lsSet(k,null);       /* 格式不對或明文殘留，清掉 */
  return Promise.resolve(null);
}

function baseDay(){ return String((BASE&&BASE.price_date)||"").slice(0,10); }
function sameBase(){ return BASE && OV && BASE.equity_entered===OV.base_entered && String(BASE.equity_as_of||"")===OV.base_as_of; }
/* 手機輸入之後電腦又更新過收盤價：能算就把之後的損益加回去，不能算就明講這個數字過期了 */
function overrideState(){
  if(!OV||!BASE) return null;
  var day=baseDay(), st={adj:0, stale:false, estimated:false};
  if(day>OV.as_of){
    if(sameBase() && ok(OV.ref_mtm) && ok(BASE.equity_mtm_adj)){ st.adj=BASE.equity_mtm_adj-OV.ref_mtm; st.estimated=true; }
    else st.stale=true;
  }
  return st;
}
function applyOverride(){
  OVX=overrideState();
  D.alert = (OV && BASE)? recalc(BASE, OV.equity, OV.as_of, OVX.adj) : BASE;
  var a=D.alert;
  document.getElementById("hd-dot").className="lampdot "+(a? "lamp-"+a.level_key : "");
  document.getElementById("hd-level").textContent=a? a.level.replace(/^\S+\s*/,"")+"｜"+wan(a.equity)+(a.phone_override?"（手機）":"") : "台股投組";
}
function saveOV(){ return sPut(LS_OV, OV); }
function loadStored(){
  OV=null; TOKEN=null;
  return sGet(LS_OV).then(function(o){
    if(BASE && o && ok(o.equity) && o.equity>0 && o.as_of && ok(o.ts)){
      var applied=D.meta.inbox_applied_ts||0, eqDay=String(BASE.equity_as_of||"").slice(0,10), rej=D.meta.inbox_rejected;
      if(applied>=o.ts || (eqDay && eqDay>o.as_of)) sPut(LS_OV,null);     /* 電腦已套用並重算，或電腦上有更新日期的權益數 */
      else{
        OV=o; var dirty=false;
        if(rej && rej.ts===o.ts && !o.rejected){ o.rejected=rej.reason||"電腦沒有套用"; o.sent=false; dirty=true; }
        if(baseDay()===o.as_of && sameBase() && !ok(o.ref_mtm)){ o.ref_mtm=BASE.equity_mtm_adj||0; dirty=true; }   /* 記下輸入當天收盤的基準 */
        if(dirty) saveOV();
      }
    }
    return ENC? sGet(LS_TOKEN) : null;
  }).then(function(t){ TOKEN=(t&&typeof t.token==="string")? t.token : null; });
}
function canSync(){ return !!(ENC && KEY && D.meta.sync); }
function sendInbox(msg){
  var S=D.meta.sync, iv=crypto.getRandomValues(new Uint8Array(12));
  var api="https://api.github.com/repos/"+encodeURIComponent(S.owner)+"/"+encodeURIComponent(S.repo)+"/contents/"+S.path;
  var hd={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  msg.v=1; msg.kind="inbox";
  var bad=function(r){ return new Error(r.status===401? "GitHub 金鑰無效或已過期" : (r.status===403||r.status===404? "GitHub 金鑰沒有回寫 repo 的寫入權限" : (r.status===409||r.status===422? "GitHub 上的檔案剛被更新，請再按一次" : "GitHub 回應 "+r.status))); };
  return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},KEY,new TextEncoder().encode(JSON.stringify(msg))).then(function(ct){
    var body=JSON.stringify({v:1,iter:ITER,salt:SALT,iv:b64e(iv),ct:b64e(ct)});
    return fetch(api+"?ref="+encodeURIComponent(S.branch),{headers:hd,cache:"no-store"}).then(function(r){
      if(r.status===200) return r.json().then(function(j){ return j.sha; });
      if(r.status===404) return null;        /* 檔案還不存在（或金鑰沒權限，下一步 PUT 會講清楚） */
      throw bad(r);
    }).then(function(sha){
      var req={message:"update",content:btoa(body),branch:S.branch}; if(sha) req.sha=sha;
      return fetch(api,{method:"PUT",headers:hd,body:JSON.stringify(req)});
    }).then(function(r){ if(r.status===200||r.status===201) return true; throw bad(r); });
  });
}
function equityCard(){
  var a=D.alert, st=h("p",{class:"note",id:"eq-status",style:"margin:8px 0 0",role:"status"});
  var inp=h("input",{id:"eq-input",type:"number",inputmode:"decimal",step:"any",min:"0",value:String(Math.round((OV?OV.equity:a.equity)/100)/100),"aria-label":"權益數，單位萬元"});
  var go=h("button",{class:"btn",type:"submit",text:"更新"});
  var form=h("form",{class:"eqform",id:"eq-form"},h("label",null,inp,span("萬","muted")),go);
  if(OV){ var undo=h("button",{class:"btn ghost",type:"button",text:"還原"});
    undo.addEventListener("click",function(){
      var was=OV, needCancel=was.sent || sending===was;
      OV=null; sending=null; sPut(LS_OV,null); applyOverride();
      if(!needCancel){ syncMsg=""; render(); return; }
      if(!(canSync()&&TOKEN)){ syncMsg="手機上已還原，但先前送出的 "+wan(was.equity)+" 收不回來，電腦下次更新仍會套用。請在電腦上改回，或重新輸入正確數字。"; render(); return; }
      syncMsg="正在通知電腦取消…"; render();
      sendInbox({ts:Date.now(),cancel:true}).then(function(){ syncMsg="已還原，也已通知電腦不要套用先前送出的數字。"; render(); },
        function(e){ syncMsg="手機上已還原，但取消沒送成功（"+(e&&e.message||e)+"），電腦下次更新仍會套用 "+wan(was.equity)+"。"; render(); });
    }); form.appendChild(undo); }
  var late= OV && OV.sent && (D.meta.generated_ts||0)>OV.ts+60000;
  st.textContent = syncMsg || (!OV? "輸入券商 App 上的權益數，燈號與距離會當場重算。"
    : OV.rejected? "電腦沒有套用這筆更新："+OV.rejected+"。這個數字目前只在這支手機上。"
    : OV.sent? (late? "已在 "+OV.at+" 送回電腦，但電腦之後產生的這一版頁面還沒套用；下次更新若仍如此，請在電腦上看 mobile_inbox_log.csv。"
                    : "已在 "+OV.at+" 加密送回電腦，電腦下次更新時套用（每天 18:00，或在電腦上雙擊「手機版網頁」）。")
    : "只存在這支手機上，還沒送回電腦。");
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var v=parseFloat(inp.value);
    if(!ok(v)||v<10||v>500000){ st.textContent="請輸入 10 到 500,000 之間的數字，單位是萬元。"; return; }
    var cur=D.alert.equity, eq=Math.round(v*1e4);
    if(BASE && (eq<BASE.equity*0.5 || eq>BASE.equity*2) && form.getAttribute("data-confirm")!==String(eq)){
      form.setAttribute("data-confirm",String(eq));
      st.textContent="這個數字（"+wan(eq)+"）和電腦上的 "+wan(BASE.equity)+" 差了一倍以上。確定沒有打錯的話，再按一次「更新」。"; return; }
    var t=nowStamp();
    OV={equity:eq, as_of:t.day, at:t.at, ts:t.ts, sent:false,
        base_entered:BASE.equity_entered, base_as_of:String(BASE.equity_as_of||""), ref_mtm:(baseDay()===t.day? (BASE.equity_mtm_adj||0) : null)};
    var mine=OV; syncMsg=""; applyOverride(); render();
    saveOV().then(function(saved){
      if(OV!==mine) return;
      if(!saved){ syncMsg="這個瀏覽器不能儲存，重新整理後會回到電腦的數字。"; render(); }
      if(!(canSync()&&TOKEN)) return;
      sending=mine; syncMsg="正在加密送回電腦…"; render();
      sendInbox({ts:mine.ts,equity:mine.equity,equity_as_of:mine.as_of}).then(function(){
        if(sending===mine) sending=null;
        if(OV===mine){ mine.sent=true; saveOV(); syncMsg=""; render(); }
      }, function(e){
        if(sending===mine) sending=null;
        if(OV===mine){ syncMsg="手機上已重算，但送回電腦失敗："+(e&&e.message||e)+"。"; render(); }
      });
    });
  });
  var box=card("更新權益數", form, st);
  box.classList.add("sync");
  if(canSync()){
    var has=!!TOKEN, tin=h("input",{id:"gh-token",type:"password",autocomplete:"off",placeholder:has?"已儲存，可貼上新的取代":"貼上 GitHub 金鑰","aria-label":"GitHub 金鑰"});
    var save=h("button",{class:"btn ghost",type:"button",text:"儲存"}), clr=h("button",{class:"btn ghost",type:"button",text:"清除"});
    save.addEventListener("click",function(){ var t=tin.value.trim(); if(!t) return;
      sPut(LS_TOKEN,{token:t}).then(function(saved){ if(saved){ TOKEN=t; syncMsg="金鑰已加密存在這支手機上。之後按「更新」會同時送回電腦。"; } else syncMsg="這個瀏覽器不能儲存金鑰。"; render(); }); });
    clr.addEventListener("click",function(){ sPut(LS_TOKEN,null); TOKEN=null; syncMsg="已清除這支手機上的金鑰。"; render(); });
    box.appendChild(h("details",null,h("summary",{text:has?"送回電腦：已設定":"送回電腦：尚未設定"}),
      h("p",{class:"note",style:"margin:8px 0 0",text:"需要一把只能寫入 "+D.meta.sync.owner+"/"+D.meta.sync.repo+" 的 GitHub 金鑰（fine-grained token，只勾這個 repo，Contents 讀寫）。金鑰會用通關密語加密後存在這支手機裡；送出的數字也用通關密語加密。"}),
      h("div",{class:"tok"},tin,save,has?clr:null)));
  } else {
    box.appendChild(h("p",{class:"note",style:"margin:8px 0 0",text: ENC? "電腦還沒啟用回寫，目前只能在手機上重算。" : "這個版本只能在手機上重算，不能送回電腦。要回寫請用加密版網址。"}));
  }
  return box;
}

/* ---------- 外框 ---------- */
function current(){ var v=(location.hash||"").replace("#",""); return VIEWS.indexOf(v)>=0? v : "overview"; }
function render(){
  var v=current(), keepFocus=(document.activeElement&&document.activeElement.id==="lookup-q");
  var nodes={overview:viewOverview,holdings:viewHoldings,scenarios:viewScenarios,news:viewNews,lookup:viewLookup}[v]();
  app.textContent=""; nodes.forEach(function(n){ if(n) app.appendChild(n); });
  document.querySelectorAll("#tabs a").forEach(function(a){ if(a.getAttribute("href")==="#"+v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(keepFocus){ var i=document.getElementById("lookup-q"); if(i) i.focus(); }
}
function start(data){
  D=data; BASE=D.alert||null;
  if(!D.meta.levels && BASE) D.meta.levels={tiers:[],ok:{label:BASE.level,key:BASE.level_key},action:{}};
  applyOverride(); var a=D.alert;
  document.getElementById("hd-when").textContent=(a? "價格 "+a.price_date+"\n警示 "+(a.generated_at||"").slice(5,16).replace("T"," ") : "更新 "+(D.meta.generated_at||"").slice(5,16));
  document.getElementById("hd-when").style.whiteSpace="pre";
  window.addEventListener("hashchange",function(){ render(); window.scrollTo(0,0); });
  render();
  loadStored().then(function(){ if(OV||TOKEN){ applyOverride(); render(); } }, function(){});
}

/* ---------- 解密（只在加密版本用到） ---------- */
function b64(s){ var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function storeSalt(){
  var v=lsGet(LS_SALT);
  if(v){ try{ var u=b64(v); if(u.length===16) return u; }catch(e){} }
  var n=crypto.getRandomValues(new Uint8Array(16));
  return lsSet(LS_SALT,b64e(n))? n : null;         /* 不能存就不做本機加密儲存 */
}
function unlock(P, pass){
  var enc=new TextEncoder(), km0, data;
  pass=String(pass||"").trim(); if(pass.normalize) pass=pass.normalize("NFKC");
  var derive=function(km,salt,usages){ return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,usages); };
  return crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]).then(function(km){
    km0=km; return derive(km,b64(P.salt),["decrypt","encrypt"]);
  }).then(function(key){ KEY=key; SALT=P.salt; ITER=P.iter; return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct)); })
    .then(function(buf){ data=JSON.parse(new TextDecoder().decode(buf));
      var ss=storeSalt(); return ss? derive(km0,ss,["decrypt","encrypt"]).then(function(k){ SKEY=k; }, function(){ SKEY=null; }) : null; })
    .then(function(){ return data; });
}
var P=JSON.parse(document.getElementById("payload").textContent);
ENC=!!P.enc;
if(!P.enc){ start(P.data); }
else{
  var lock=document.getElementById("lock"), err=document.getElementById("lock-err"), tabs=document.getElementById("tabs");
  lock.hidden=false; tabs.hidden=true; document.getElementById("hd-when").textContent="已加密";
  lock.addEventListener("submit",function(ev){
    ev.preventDefault(); err.textContent="";
    if(!(window.crypto&&crypto.subtle)){ err.textContent="這個瀏覽器不支援解密，請用 https 網址開啟。"; return; }
    unlock(P, document.getElementById("lock-pass").value).then(function(data){
      try{ tabs.hidden=false; start(data); lock.hidden=true; }
      catch(e){ tabs.hidden=true; err.textContent="密語正確，但資料顯示失敗："+(e&&e.message||e); }
    }, function(){ KEY=null; SKEY=null; err.textContent="密語不對，請再試一次。"; });
  });
}
})();
